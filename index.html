<!-- Application Script -->
    <script>
        const API_URL = "https://personalised-feed.onrender.com/api";
        let currentCategory = "all";
        let isCatchupActive = false;
        let savedArticles = JSON.parse(localStorage.getItem("savedArticles") || "[]");
        let archivedArticles = JSON.parse(localStorage.getItem("archivedArticles") || "[]");

        document.addEventListener("DOMContentLoaded", () => {
            updateSavedCount();
            fetchNews();
            fetchBulletins();
        });

        function switchCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll(".tab-btn").forEach(b => {
                b.classList.remove("border-brand-500", "text-brand-500");
                b.classList.add("border-transparent", "text-slate-400");
            });
            btn.classList.remove("border-transparent", "text-slate-400");
            btn.classList.add("border-brand-500", "text-brand-500");
            
            document.getElementById("activeCategoryLabel").innerText = `Showing: ${btn.innerText.split('(')[0].trim()}`;
            fetchNews();
        }

        function toggleCatchup() {
            isCatchupActive = !isCatchupActive;
            const btn = document.getElementById("catchupBtn");
            if (isCatchupActive) {
                btn.classList.replace("bg-amber-600", "bg-emerald-600");
                btn.innerText = "✓ Catchup Mode (48h On)";
            } else {
                btn.classList.replace("bg-emerald-600", "bg-amber-600");
                btn.innerText = "⚡ Daily Catchup (48h)";
            }
            fetchNews();
        }

        async function fetchNews() {
            const container = document.getElementById("articlesContainer");
            container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">Loading articles... (Render may take 30s to wake up if idle)</div>`;

            if (currentCategory === "saved") {
                renderArticles(savedArticles);
                return;
            }

            const sort = document.getElementById("sortSelect").value;
            let url = `${API_URL}/news?category=${currentCategory}&sort=${sort}`;
            if (isCatchupActive) url += `&catchup_hours=48`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderArticles(data.articles);
            } catch (err) {
                container.innerHTML = `<div class="p-4 bg-red-900/30 text-red-400 rounded-lg text-xs">Failed to fetch articles. Server may be starting up—please refresh in 30 seconds.</div>`;
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById("articlesContainer");
            document.getElementById("articleCount").innerText = `${articles.length} articles`;

            if (!articles || articles.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No articles found in this view.</div>`;
                return;
            }

            container.innerHTML = articles.map(a => {
                const isSaved = savedArticles.some(item => item.id === a.id);
                return `
                    <article class="bg-slate-800 border border-slate-700/80 hover:border-slate-600 rounded-xl p-4 transition shadow-sm space-y-2">
                        <div class="flex items-center justify-between text-xs text-slate-400">
                            <span class="bg-slate-700/60 px-2 py-0.5 rounded text-brand-400 font-medium uppercase text-[10px]">${a.category} • ${a.source}</span>
                            <span>${a.published_formatted}</span>
                        </div>
                        <h2 class="text-base font-semibold text-slate-100 hover:text-brand-400 transition">
                            <a href="${a.link}" target="_blank">${a.title}</a>
                        </h2>
                        <p class="text-xs text-slate-300 leading-relaxed">${a.summary}</p>
                        <div class="flex items-center justify-between pt-2 text-xs border-t border-slate-700/50">
                            <span class="text-slate-500 text-[11px]">Relevance Score: ${a.relevance}</span>
                            <div class="flex space-x-2">
                                <button onclick='toggleSaveArticle(${JSON.stringify(a).replace(/'/g, "&apos;")})' class="px-2.5 py-1 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px]">
                                    ${isSaved ? 'Bookmark Removed' : '🔖 Read Later'}
                                </button>
                                <button onclick='archiveArticle(${JSON.stringify(a).replace(/'/g, "&apos;")})' class="px-2.5 py-1 rounded bg-emerald-800/60 hover:bg-emerald-700 text-emerald-200 text-[11px]">
                                    ✓ Mark Read
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        async function fetchBulletins() {
            try {
                const res = await fetch(`${API_URL}/bulletins`);
                const bulletins = await res.json();
                document.getElementById("bulletinFeed").innerHTML = bulletins.map(b => `
                    <div class="pt-2">
                        <p class="text-slate-200 leading-snug">${b.text}</p>
                        <span class="text-[10px] text-slate-500">${b.time}</span>
                    </div>
                `).join('');
            } catch (e) {}
        }

        function toggleSaveArticle(article) {
            const index = savedArticles.findIndex(a => a.id === article.id);
            if (index > -1) {
                savedArticles.splice(index, 1);
            } else {
                savedArticles.push(article);
            }
            localStorage.setItem("savedArticles", JSON.stringify(savedArticles));
            updateSavedCount();
            if (currentCategory === "saved") fetchNews();
        }

        function archiveArticle(article) {
            const basket = prompt("Sort into Basket (e.g., Engineering, Sports Intel, Market Research):", "General") || "General";
            article.basket = basket;
            archivedArticles.push(article);
            localStorage.setItem("archivedArticles", JSON.stringify(archivedArticles));
            alert(`Archived under "${basket}"!`);
        }

        function updateSavedCount() {
            document.getElementById("savedCount").innerText = savedArticles.length;
        }

        function openArchiveModal() {
            document.getElementById("archiveModal").classList.remove("hidden");
            const list = document.getElementById("archiveList");
            if (archivedArticles.length === 0) {
                list.innerHTML = `<p class="text-slate-400">No completed reads archived yet.</p>`;
                return;
            }
            list.innerHTML = archivedArticles.map(a => `
                <div class="p-3 bg-slate-900/60 rounded border border-slate-700 flex justify-between items-center">
                    <div>
                        <a href="${a.link}" target="_blank" class="font-medium text-slate-200 hover:underline">${a.title}</a>
                        <p class="text-[10px] text-slate-400">Source: ${a.source}</p>
                    </div>
                    <span class="bg-brand-900/50 text-brand-300 border border-brand-700/50 px-2 py-0.5 rounded text-[10px]">${a.basket}</span>
                </div>
            `).join('');
        }

        function closeArchiveModal() {
            document.getElementById("archiveModal").classList.add("hidden");
        }
    </script>
